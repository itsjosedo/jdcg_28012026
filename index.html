<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jose  Douglas Calles Gomez...</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 10px 25px rgba(0,0,0,.08);
    }

    .card h1 {
      margin: 0 0 6px;
      font-size: 22px;
    }

    .card p {
      margin: 0 0 18px;
      color: #6b7280;
      font-size: 14px;
    }

    label {
      display: block;
      font-size: 14px;
      margin: 10px 0 6px;
      color: #111827;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .15);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 12px 0 16px;
      gap: 10px;
    }

    .row a {
      font-size: 13px;
      color: #2563eb;
      text-decoration: none;
    }

    .row a:hover {
      text-decoration: underline;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #374151;
      user-select: none;
    }

    .check input {
      width: 16px;
      height: 16px;
      padding: 0;
      margin: 0;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      background: #2563eb;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      background: #1d4ed8;
    }

    .footer {
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
      color: #6b7280;
    }

    .footer a {
      color: #2563eb;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Iniciar sesión</h1>
    <p>Ingresa tu correo y contraseña.</p>

    <form action="#" method="post">
      <label for="email">Correo</label>
      <input id="email" name="email" type="email" placeholder="tucorreo@ejemplo.com" required />

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" placeholder="••••••••" required />

      <div class="row">
        <label class="check">
          <input type="checkbox" name="remember" />
          Recuérdame
        </label>

        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit">Entrar</button>
    </form>

    <div class="footer">
      ¿No tienes cuenta? <a href="#">Regístrate</a>
    </div>
  </main>
</body>
</html>
